[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-regime-lab"
version = "0.1.0"
description = "Walk-forward volatility forecasting, HMM regime detection and anomaly flags on public FRED market data — with Diebold–Mariano and VaR backtests, no lookahead by construction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adil Bahir" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "arch>=6.0", "hmmlearn>=0.3", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
